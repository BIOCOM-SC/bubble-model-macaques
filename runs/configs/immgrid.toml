description = "t_imm x f_imm grid at the fit-A optimum (stronger vs earlier immunity): Fig. 4 and the vaccinated-macaque comparison"
type = "cases"
base = "fitA"

# t_imm 0-45 d, step 1 d: 0 = immunity active from infection; 45 = upper bound of the fits (Table 1),
# so the unvaccinated optimum (39.8) is interior. The response changes fastest at t_imm < 15 d
# (lesions reach their maximum radius within days), hence 1-d steps.
# f_imm 0.10-1.00, step 0.05 = the fits' bounds (Table 1); f_imm = 1 is "no adaptive immunity".
# 46 x 19 = 874 cases x 10^4 simulated animals; ~1.6 h on 2 nodes.
[[grid]]
name = "grid"
[grid.params]
tc    = [0.0, 45.0, 46]
fvimm = { values = [0.10, 0.15, 0.20, 0.25, 0.30, 0.35, 0.40, 0.45, 0.50, 0.55, 0.60, 0.65, 0.70, 0.75, 0.80, 0.85, 0.90, 0.95, 1.00] }   # frimm follows (tied); exact values
